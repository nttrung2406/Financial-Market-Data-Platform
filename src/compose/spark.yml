services:
  spark:
    build:
      context: ..
      dockerfile: spark/Dockerfile
    container_name: financial-platform-spark
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark
      SPARK_MASTER_PORT: 7077
      SPARK_DAEMON_MEMORY: 1g
    ports:
      - "7077:7077"
      - "8082:8080"
    volumes:
      - ../spark_jobs:/opt/bitnami/spark/jobs
      - ../data:/opt/bitnami/spark/data

  spark-worker:
    build:
      context: ..
      dockerfile: spark/Dockerfile
    container_name: financial-platform-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: 1
    depends_on:
      - spark