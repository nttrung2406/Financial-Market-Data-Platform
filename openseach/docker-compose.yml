services:
  opensearch-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-platform-opensearch-bridge
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: admin
      OPENSEARCH_DASHBOARDS_HOST: opensearch-dashboards
    depends_on:
      - opensearch
      - kafka
    restart: unless-stopped

  opensearch-setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-platform-opensearch-setup
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_DASHBOARDS_HOST: opensearch-dashboards
    command: ["python", "setup_dashboards.py"]
    depends_on:
      - opensearch-dashboards
    restart: "no"