services:
  superset:
    build:
      context: ..
      dockerfile: superset/Dockerfile
    container_name: financial-platform-superset
    environment:
      SUPERSET_SECRET_KEY: "change-me-in-production"
      DATABASE_URL: postgresql+psycopg2://finance:finance@postgres:5432/finance
      MAPBOX_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8086:8086"
    volumes:
      - ../superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - bash
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin \
          --username admin --firstname Admin --lastname User \
          --email admin@example.com --password admin || true &&
        superset init &&
        python /app/pythonpath/bootstrap.py &
        exec superset run -p 8086 --with-threads

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: financial-platform-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9601:9601"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    container_name: financial-platform-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch
    ports:
      - "5602:5602"
    volumes:
      - ../openseach/opensearch_dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro

volumes:
  opensearch-data:
